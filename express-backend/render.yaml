# TEFERA Portfolio — Render blueprint (Express API, free tier)
# Import this repo "New + > Blueprint". Render builds the Node service from
# express-backend/ and connects it to a Supabase Postgres database.
services:
  - type: web
    name: tefera-portfolio-api
    runtime: node
    plan: free
    rootDir: express-backend
    buildCommand: npm install --omit=dev
    startCommand: node src/server.js
    autoDeploy: true
    healthCheckPath: /up
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_URL
        sync: false
      - key: FRONTEND_URL
        value: https://tefera-portfolio-node.vercel.app
      # Postgres / Supabase connection string — set this manually in Render
      # (Dashboard -> Environment) or when importing the blueprint.
      - key: DATABASE_URL
        sync: false
      - key: ANALYTICS_ENABLED
        value: "true"